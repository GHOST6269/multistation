<main class="login-page">
  <section class="login-showcase" aria-hidden="true">
    <div class="showcase-mark">⛽</div>
    <p>STATIONFLOW</p>
    <h2>Pilotez votre station<br />en toute simplicité.</h2>
    <span>Ventes, livraisons, encaissements et suivi des cuves réunis dans un même espace.</span>
    <div class="showcase-points"><i></i><span>Suivi des opérations en temps réel</span><i></i><span>Accès sécurisé par rôle</span></div>
  </section>
  <section class="login-panel">
    <div class="brand-lockup">
      <span>SF</span>
      <div>
        <strong>StationFlow</strong>
        <small>Gestion station carburant</small>
      </div>
    </div>
    <p class="login-eyebrow">ESPACE SÉCURISÉ</p>
    <h1>Bon retour</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label>
        <span>Mot de passe</span>
        <span class="password-field">
          <input [type]="passwordVisible ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="passwordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.aria-pressed]="passwordVisible">
            @if (passwordVisible) {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.4 0 9.2 5.1 9.8 6a1.8 1.8 0 0 1 0 2c-.5.7-1.7 2.2-3.6 3.5M6.1 6.1C3.9 7.6 2.6 9.5 2.2 10a1.8 1.8 0 0 0 0 2C2.8 12.9 6.6 18 12 18c1 0 1.9-.2 2.8-.5" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 10a1.8 1.8 0 0 0 0 2C2.8 12.9 6.6 18 12 18s9.2-5.1 9.8-6a1.8 1.8 0 0 0 0-2C21.2 9.1 17.4 4 12 4S2.8 9.1 2.2 10Z" /><circle cx="12" cy="11" r="3" /></svg>
            }
          </button>
        </span>
      </label>
      @if (error) { <p class="form-error">{{ error }}</p> }
      <button type="submit" [disabled]="loading">
        @if (loading) { <span class="button-spinner"></span> } @else { <span>→</span> }
        Se connecter
      </button>
    </form>
  </section>
</main>
