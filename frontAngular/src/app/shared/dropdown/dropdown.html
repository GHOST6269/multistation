<div class="dropdown" [class.open]="open" [class.disabled]="disabled">
  <button
    type="button"
    class="trigger"
    (click)="toggle()"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
  >
    <span class="station-symbol">{{ selected?.label?.charAt(0) || '◇' }}</span>
    <span class="selected-text"
      ><small>{{ selected ? 'STATION SÉLECTIONNÉE' : 'SÉLECTION' }}</small
      ><strong>{{ selected?.label || placeholder }}</strong></span
    >
    <span class="chevron">⌄</span>
  </button>
  @if (open) {
    <div class="menu fixed-menu" [ngStyle]="menuStyle">
      @if (searchable) {
        <label class="search"
          >⌕<input
            [(ngModel)]="search"
            (click)="$event.stopPropagation()"
            placeholder="Rechercher…"
            autofocus
        /></label>
      }
      <div class="options">
        @for (option of filtered; track option.value) {
          <button
            type="button"
            class="option"
            [class.selected]="option.value === value"
            (click)="select(option)"
          >
            <span class="option-icon">{{ option.label.charAt(0) }}</span
            ><span
              ><strong>{{ option.label }}</strong>
              @if (option.hint) {
                <small>{{ option.hint }}</small>
              }
            </span>
            @if (option.value === value) {
              <i>✓</i>
            }
          </button>
        } @empty {
          <p class="no-result">Aucun résultat</p>
        }
      </div>
    </div>
  }
</div>
